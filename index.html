<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.95),transparent 24%),
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.7),transparent 22%),
    linear-gradient(135deg,#fff8ed 0%,#ffe8f0 48%,#e9f7ff 100%);
}

.card-wrap{
  position:relative;
  width:min(1129px,100vw);
  aspect-ratio:1129/637;
  z-index:2;
}

.card{
  position:absolute;
  inset:0;
  overflow:hidden;
  opacity:0;
  transform:scale(.985);
  transition:opacity .65s ease,transform .65s ease;
  box-shadow:0 12px 40px rgba(72,48,39,.13);
  background:#f3f0dd;
}
.card.show{
  opacity:1;
  transform:scale(1);
  animation:cardReveal .95s cubic-bezier(.18,.85,.28,1.12) both;
}

@keyframes cardReveal{
  0%{opacity:0;transform:scale(.92) translateY(18px);filter:blur(5px)}
  65%{opacity:1;transform:scale(1.018) translateY(-3px);filter:blur(0)}
  100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}
}

.card-design{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  z-index:1;
}

/* lời chúc hiển thị trực tiếp trên thiệp */
.wish-text{
  position:absolute;
  left:69.0%;
  top:60.0%;
  width:17.8%;
  min-height:8.8%;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px 8px;

  font-family:"Segoe UI", Tahoma, Arial, "Helvetica Neue", sans-serif;
  font-size:clamp(13px,1.35vw,20px);
  font-weight:700;
  line-height:1.32;
  letter-spacing:0;
  font-style:normal;

  color:#6b4032;
  text-align:center;
  white-space:pre-line;
  word-break:normal;
  overflow-wrap:break-word;

  text-shadow:0 1px 0 rgba(255,255,255,.72);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  pointer-events:none;
}


/* hiệu ứng */
.fx,.fall-layer,.confetti-layer{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:7;
}

.sparkle{
  position:absolute;
  width:13px;height:13px;
  animation:twinkle 2.2s ease-in-out infinite;
  opacity:.85;
}
.sparkle::before,.sparkle::after{
  content:"";
  position:absolute;
  border-radius:999px;
  background:#fff;
}
.sparkle::before{width:3px;height:100%;left:50%;transform:translateX(-50%)}
.sparkle::after{height:3px;width:100%;top:50%;transform:translateY(-50%)}
.sparkle.pink::before,.sparkle.pink::after{background:#f49ebc}
.sparkle.blue::before,.sparkle.blue::after{background:#88d0ef}
.sparkle.gold::before,.sparkle.gold::after{background:#ffd467}
@keyframes twinkle{
  0%,100%{transform:scale(.5) rotate(0);opacity:.2}
  50%{transform:scale(1.18) rotate(45deg);opacity:1}
}

.fall{
  position:absolute;
  top:-10%;
  animation:fall linear forwards;
  text-shadow:0 2px 7px rgba(255,255,255,.7);
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);opacity:0}
  10%{opacity:.95}
  100%{transform:translateY(120vh) rotate(380deg);opacity:0}
}

.confetti{
  position:absolute;
  top:-10%;
  width:9px;height:15px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  from{transform:translateY(-10vh) rotate(0);opacity:1}
  to{transform:translateY(120vh) rotate(540deg);opacity:0}
}


/* ===== hiệu ứng thiệp nâng cấp ===== */
.shimmer{
  position:absolute;
  top:-20%;
  left:-35%;
  width:22%;
  height:145%;
  z-index:6;
  pointer-events:none;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.10),
    rgba(255,255,255,.70),
    rgba(255,235,246,.34),
    transparent
  );
  filter:blur(1px);
  transform:skewX(-15deg);
  animation:shimmerMove 4.8s ease-in-out infinite;
}

@keyframes shimmerMove{
  0%,20%{left:-35%;opacity:0}
  35%{opacity:.9}
  62%{left:112%;opacity:.75}
  63%,100%{left:112%;opacity:0}
}

.glow-orb{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  z-index:5;
  filter:blur(15px);
  opacity:.22;
  animation:orbFloat 5.5s ease-in-out infinite alternate;
}

@keyframes orbFloat{
  from{transform:translateY(0) scale(.95)}
  to{transform:translateY(-15px) scale(1.12)}
}

.cute-float{
  position:absolute;
  z-index:7;
  pointer-events:none;
  font-size:clamp(15px,1.8vw,25px);
  opacity:.86;
  text-shadow:0 2px 8px rgba(255,255,255,.75);
  animation:cuteFloat 4.5s ease-in-out infinite;
}

@keyframes cuteFloat{
  0%,100%{transform:translateY(0) rotate(-5deg) scale(.92)}
  50%{transform:translateY(-10px) rotate(7deg) scale(1.08)}
}

.magic-pop{
  position:absolute;
  z-index:9;
  pointer-events:none;
  font-size:22px;
  animation:magicPop 1.25s ease-out forwards;
}

@keyframes magicPop{
  0%{transform:translate(-50%,-50%) scale(.25) rotate(0);opacity:0}
  22%{opacity:1}
  100%{transform:translate(-50%,-115%) scale(1.35) rotate(35deg);opacity:0}
}

.card.show .wish-text{
  animation:wishAppear 1.25s .45s both, wishGlow 2.8s 1.7s ease-in-out infinite;
}

@keyframes wishAppear{
  from{opacity:0;transform:translateY(8px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes wishGlow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  50%{filter:drop-shadow(0 0 7px rgba(255,255,255,.85))}
}


/* ===== CHỈ HIỆU ỨNG NẢY CHO TÊN NGUYỄN THỊ NGỌC ANH ===== */
.name-bounce-overlay{
  position:absolute;
  left:3.8%;
  bottom:3.5%;
  width:47.8%;
  height:11.8%;
  z-index:12;
  display:flex;
  align-items:center;
  padding-left:.25%;
  background:rgb(255,255,235); 
  overflow:visible;
  pointer-events:none;
  white-space:nowrap;
}

.name-char{
  display:inline-block;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(30px,4vw,55px);
  font-weight:700;
  line-height:1;
  color:#fffdeb;
  -webkit-text-stroke:1.45px #704338;
  text-shadow:0 1px 0 #704338;
  transform-origin:50% 100%;
  will-change:transform;
}

.name-space{
  display:inline-block;
  width:.28em;
}

.card.show .name-char{
  animation:nameWaveBounce 2.45s cubic-bezier(.25,.75,.25,1) infinite;
  animation-delay:var(--name-delay);
}

@keyframes nameWaveBounce{
  0%,17%,100%{
    transform:translateY(0) scale(1) rotate(0);
  }
  4%{
    transform:translateY(-15px) scale(1.08,.92) rotate(-2deg);
  }
  8%{
    transform:translateY(4px) scale(.97,1.05) rotate(1deg);
  }
  11%{
    transform:translateY(-6px) scale(1.035,.98) rotate(-1deg);
  }
  14%{
    transform:translateY(1px) scale(.995,1.01) rotate(0);
  }
}

.card.show .name-bounce-overlay{
  animation:nameGlow 3.2s ease-in-out infinite;
}

@keyframes nameGlow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  50%{filter:drop-shadow(0 0 5px rgba(255,255,255,.55))}
}


/* ===== NGÀY SINH NHẬT CÓ THỂ SỬA TRONG CODE ===== */
.birthday-date-overlay{
  position:absolute;
  left:43.9%;
  top:44.0%;
  width:15.5%;
  height:7.0%;
  z-index:11;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgb(255,255,235);
  color:#684034;
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
  font-size:clamp(15px,2.05vw,29px);
  font-weight:800;
  letter-spacing:.02em;
  white-space:nowrap;
  pointer-events:none;
}

/* phong bì */
.intro{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 20% 18%,rgba(255,255,255,.95),transparent 25%),
    radial-gradient(circle at 80% 18%,rgba(255,255,255,.7),transparent 22%),
    linear-gradient(135deg,#fff8ec,#ffe8ef 50%,#e9f7ff);
  transition:opacity .7s ease,visibility .7s ease;
}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}

.envelope-wrap{
  position:relative;
  width:min(480px,86vw);
  aspect-ratio:1.45/1;
  cursor:pointer;
  animation:float 2.7s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.envelope-shadow{
  position:absolute;left:14%;right:14%;bottom:3%;height:11%;
  border-radius:50%;background:rgba(93,58,47,.16);filter:blur(16px)
}
.envelope{
  position:absolute;left:7%;right:7%;top:17%;bottom:14%;
  border:4px solid #684034;border-radius:22px;
  background:linear-gradient(#f9d1dc,#f3b7c8);
  box-shadow:0 20px 42px rgba(105,64,52,.18);
}
.letter{
  position:absolute;left:12%;right:12%;top:14%;height:60%;z-index:2;
  border:3px solid #684034;border-radius:16px;background:#fffced;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#684034;transform:translateY(24%);
  transition:transform .7s cubic-bezier(.2,.8,.2,1)
}
.letter strong{font-family:Georgia,serif;font-size:clamp(25px,5vw,36px)}
.letter span{margin-top:8px;font-weight:700;font-size:14px}
.front{position:absolute;inset:0;z-index:5;overflow:hidden;border-radius:18px}
.front::before{
  content:"";position:absolute;left:-5%;right:-5%;bottom:-3%;height:80%;
  background:#f4b5c7;border:4px solid #684034;
  clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%)
}
.flap{
  position:absolute;left:-1%;right:-1%;top:-1%;height:55%;z-index:6;
  border:4px solid #684034;border-radius:18px 18px 0 0;
  background:linear-gradient(#fde2e8,#f8c4d2);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:50% 0;transition:transform .72s cubic-bezier(.2,.75,.2,1)
}
.seal{
  position:absolute;left:50%;top:57%;z-index:8;width:55px;height:55px;
  transform:translate(-50%,-50%);border:3px solid #684034;border-radius:50%;
  background:#efa5ba;display:grid;place-items:center;color:#fff9ef;font-size:27px;font-weight:900;
  transition:.25s
}
.tap{
  position:absolute;left:50%;bottom:-1%;transform:translateX(-50%);
  white-space:nowrap;padding:10px 20px;border:3px solid #684034;border-radius:999px;
  background:rgba(255,252,240,.95);color:#684034;font-weight:800;
  font-size:clamp(17px,4vw,22px)
}
.envelope-wrap.open{animation:none}
.envelope-wrap.open .flap{transform:rotateX(180deg)}
.envelope-wrap.open .letter{transform:translateY(-47%)}
.envelope-wrap.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.55)}

/* chỉ còn Chia sẻ + Full screen */
.toolbar{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:2500;
  display:flex;
  gap:10px;
}
.tool-btn{
  border:0;border-radius:999px;padding:12px 17px;
  color:#684034;font-weight:800;cursor:pointer;
  box-shadow:0 12px 32px rgba(0,0,0,.14);
  transition:.18s ease;
}
.tool-btn:hover{transform:translateY(-2px)}
.share{background:linear-gradient(135deg,#ffe0ee,#fff9ef)}
.full{background:linear-gradient(135deg,#dff5ff,#fffdf2)}

@media(max-width:640px){
  .toolbar{right:10px;bottom:10px;left:10px}
  .tool-btn{flex:1;padding:11px 10px;font-size:14px}
}
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="envelope-wrap" id="envelope" role="button" tabindex="0">
    <div class="envelope-shadow"></div>
    <div class="envelope">
      <div class="letter">
        <strong>Gửi Bạn 🧡🧡🧡</strong>
        <span>Ngày đặc biệt nhất</span>
      </div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="seal">♡</div>
    </div>
    <div class="tap">🎊Có bất ngờ🎊</div>
  </div>
</div>

const CARD_NAME = "NGUYỄN NGỌC ANH"; 
const BIRTHDAY_DATE = "17/05/2006";  
const WISH_TEXT = "Chúc bạn tuổi mới hay ăn chóng lớn thật nhiều niềm vui,\nluôn xinh đẹp, hạnh phúc và gặp nhiều may mắn! 💗";

/* ========================================================= */

wishTextDisplay.textContent = WISH_TEXT;
birthdayDateDisplay.textContent = BIRTHDAY_DATE;

function renderBouncyName(text){
  nameBounceOverlay.innerHTML = "";
  let index = 0;

  for(const ch of text){
    if(ch === " "){
      const space = document.createElement("span");
      space.className = "name-space";
      space.innerHTML = "&nbsp;";
      nameBounceOverlay.appendChild(space);
      continue;
    }

    const span = document.createElement("span");
    span.className = "name-char";
    span.textContent = ch;
    span.style.setProperty("--name-delay", (index * 0.085) + "s");
    nameBounceOverlay.appendChild(span);
    index++;
  }
}

renderBouncyName(CARD_NAME);


let audioCtx=null;
let fallTimer=null;

function createSparkles(){
  const pts=[
    ["pink",7,13],["blue",11,20],["gold",16,12],["pink",19,18],
    ["blue",57,10],["gold",63,15],["pink",68,11],["blue",74,18],
    ["gold",85,13],["pink",91,20],["blue",24,80],["gold",32,86],
    ["pink",72,79],["blue",82,86],["gold",89,73],["pink",95,81]
  ];
  pts.forEach((p,i)=>{
    const s=document.createElement("span");
    s.className="sparkle "+p[0];
    s.style.left=p[1]+"%";
    s.style.top=p[2]+"%";
    s.style.animationDelay=(i*.16)+"s";
    fx.appendChild(s);
  });
}

function createCuteEffects(){
  const orbs=[
    [7,58,58,"rgba(255,169,205,.75)"],
    [25,18,42,"rgba(150,218,250,.72)"],
    [58,14,48,"rgba(255,225,132,.70)"],
    [79,68,64,"rgba(187,170,255,.60)"],
    [92,38,44,"rgba(255,176,203,.70)"]
  ];

  orbs.forEach((o,i)=>{
    const d=document.createElement("span");
    d.className="glow-orb";
    d.style.left=o[0]+"%";
    d.style.top=o[1]+"%";
    d.style.width=o[2]+"px";
    d.style.height=o[2]+"px";
    d.style.background=o[3];
    d.style.animationDelay=(i*.55)+"s";
    cuteFx.appendChild(d);
  });

  const items=[
    ["♡",4,22,"#f49ebc"],
    ["✦",9,33,"#8fd2ef"],
    ["★",18,12,"#ffd467"],
    ["♡",59,17,"#f49ebc"],
    ["✦",66,25,"#8fd2ef"],
    ["★",91,29,"#ffd467"],
    ["♡",14,84,"#f49ebc"],
    ["✦",31,88,"#8fd2ef"],
    ["★",58,86,"#ffd467"],
    ["♡",85,82,"#f49ebc"]
  ];

  items.forEach((it,i)=>{
    const e=document.createElement("span");
    e.className="cute-float";
    e.textContent=it[0];
    e.style.left=it[1]+"%";
    e.style.top=it[2]+"%";
    e.style.color=it[3];
    e.style.animationDelay=(i*.28)+"s";
    cuteFx.appendChild(e);
  });
}

function magicBurst(){
  const symbols=["♡","✦","★","💗","⭐"];
  for(let i=0;i<14;i++){
    const e=document.createElement("span");
    e.className="magic-pop";
    e.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    e.style.left=(45+Math.random()*18)+"%";
    e.style.top=(40+Math.random()*26)+"%";
    e.style.color=["#f49ebc","#8fd2ef","#ffd467","#d0b8ff"][Math.floor(Math.random()*4)];
    e.style.animationDelay=(Math.random()*.25)+"s";
    cuteFx.appendChild(e);
    setTimeout(()=>e.remove(),1700);
  }
}

function spawnFall(){
  const chars=["❤","♡","★","✦","✿","⭐"];
  const el=document.createElement("span");
  el.className="fall";
  el.textContent=chars[Math.floor(Math.random()*chars.length)];
  el.style.left=(Math.random()*96+2)+"%";
  el.style.color=["#f5a3bd","#8ed1ef","#ffd86e","#d5c1ff"][Math.floor(Math.random()*4)];
  el.style.fontSize=(14+Math.random()*12)+"px";
  el.style.animationDuration=(5+Math.random()*4)+"s";
  fallLayer.appendChild(el);
  setTimeout(()=>el.remove(),9500);
}

function startFalling(){
  if(fallTimer)return;
  for(let i=0;i<12;i++)setTimeout(spawnFall,i*140);
  fallTimer=setInterval(spawnFall,620);
}

function confetti(){
  const colors=["#f4a2bc","#8ecff0","#ffe177","#cbb0ff","#ffb4a2","#b9e769"];
  for(let i=0;i<100;i++){
    const e=document.createElement("span");
    e.className="confetti";
    e.style.left=(Math.random()*100)+"%";
    e.style.background=colors[Math.floor(Math.random()*colors.length)];
    e.style.borderRadius=Math.random()>.5?"2px":"999px";
    e.style.animationDuration=(2.5+Math.random()*2.2)+"s";
    e.style.animationDelay=(Math.random()*.35)+"s";
    confettiLayer.appendChild(e);
    setTimeout(()=>e.remove(),5200);
  }
}

function playBirthdaySong(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const notes=[
      [392,.30],[392,.22],[440,.52],[392,.52],[523,.52],[494,.95],
      [392,.30],[392,.22],[440,.52],[392,.52],[587,.52],[523,.95],
      [392,.30],[392,.22],[784,.52],[659,.52],[523,.52],[494,.52],[440,.95],
      [698,.30],[698,.22],[659,.52],[523,.52],[587,.52],[523,1]
    ];
    let t=audioCtx.currentTime+.05;
    notes.forEach(([f,d])=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.10,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+Math.min(d,.48));
      o.connect(g);g.connect(audioCtx.destination);
      o.start(t);o.stop(t+Math.min(d,.48)+.03);
      t+=d;
    });
  }catch(e){}
}

function openEnvelope(){
  if(envelope.classList.contains("open"))return;
  envelope.classList.add("open");
  setTimeout(()=>{
    intro.classList.add("hide");
    card.classList.add("show");
    confetti();
    startFalling();
    magicBurst();
    playBirthdaySong();
  },850);
}

envelope.addEventListener("click",openEnvelope);
envelope.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();openEnvelope()}
});


document.getElementById("fullscreenBtn").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement)await cardWrap.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){alert("Trình duyệt không hỗ trợ Full screen trong chế độ này.")}
});

document.getElementById("shareBtn").addEventListener("click",async()=>{
  try{
    if(navigator.share){
      await navigator.share({
        title:"Happy Birthday",
        text:"Thiệp sinh nhật dành cho bạn 💗",
        url:location.href
      });
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(location.href);
      alert("Đã sao chép liên kết thiệp.");
    }else{
      alert("Trình duyệt này chưa hỗ trợ chia sẻ.");
    }
  }catch(e){}
});

createSparkles();
createCuteEffects();
</script>
